<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepwoken Reaction Trainer - Practice Parry, Dodge & Bosses</title>
  <meta name="description" content="Free online reaction trainer for Roblox Deepwoken. Practice parry timings, dodge reactions, and fight bosses like Primadon, Duke, Ferryman, and Maestro.">
  <meta name="keywords" content="deepwoken, deepwoken training, deepwoken reaction trainer, roblox deepwoken practice, parry practice">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b20;
      --accent: #00e676;
      --accent-danger: #ff5252;
      --text: #e0e6ed;
      --subtext: #8b98a5;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1, h2 { margin-top: 0; }
    .hp-bar-container { margin: 10px 0; }
    .hp-bar {
      height: 20px;
      background: #2a2e37;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .hp-fill {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.2s ease;
    }
    .hp-fill.boss { background: var(--accent-danger); }
    .hp-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 0;
      line-height: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }
    .cue-box {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px dashed #2a2e37;
      border-radius: 8px;
      font-size: 1.5rem;
    }
    .signal-orb {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .signal-orb.gray { background: #757575; color: #fff; }
    .signal-orb.red { background: #d32f2f; color: #fff; }
    .signal-orb.purple { background: #7b1fa2; color: #fff; }
    .signal-orb.blue { background: #1976d2; color: #fff; }
    .controls, .settings { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    button, select, input {
      background: #2a2e37;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #000; font-weight: bold; }
    button.danger { background: var(--accent-danger); color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2e37; }
    th { color: var(--subtext); }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Deepwoken Reaction Trainer</h1>
    
    <div class="settings">
      <div>
        <label>Boss: </label>
        <select id="boss">
          <option value="random">Target Dummy</option>
          <option value="primadon">Primadon</option>
          <option value="elder_primadon">Elder Primadon</option>
          <option value="duke">Duke Erisia</option>
          <option value="ferryman">Ferryman</option>
          <option value="maestro">Maestro Evengarde</option>
        </select>
      </div>

      <div>
        <label>Difficulty: </label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
          <option value="extreme">Extreme</option>
          <option value="impossible">Impossible</option>
        </select>
      </div>

      <div>
        <label>Weapon: </label>
        <select id="weapon">
          <option value="medium">Medium</option>
          <option value="heavy">Heavy</option>
          <option value="light">Light</option>
        </select>
      </div>

      <div>
        <label>Rounds: </label>
        <input type="number" id="rounds" value="20" min="5" max="100" style="width: 60px;">
      </div>
    </div>

    <div class="settings">
      <div>
        <label>Your Nickname: </label>
        <input type="text" id="username" placeholder="Enter nickname for Leaderboard" maxlength="15">
      </div>
      <button id="start" class="primary" onclick="startPractice()">Start Combat</button>
      <button id="end-btn" class="danger" onclick="stopPractice()" disabled>End Combat</button>
    </div>

    <!-- Health Bars -->
    <div class="hp-bar-container">
      <div style="display:flex; justify-content:space-between; font-size:12px;"><span id="boss-name-label">Target Dummy HP</span><span id="phase-badge" style="display:none; color:orange; font-weight:bold;">[PHASE 2]</span></div>
      <div class="hp-bar"><div id="boss-hp-fill" class="hp-fill boss"></div><div id="boss-hp-text" class="hp-text">10000/10000</div></div>
    </div>
    
    <div class="hp-bar-container">
      <div style="font-size:12px;">Player HP</div>
      <div class="hp-bar"><div id="player-hp-fill" class="hp-fill"></div><div id="player-hp-text" class="hp-text">600/600</div></div>
    </div>

    <!-- Cue Display Box -->
    <div id="cue" class="cue-box">Press "Start Combat" to begin</div>
    <p id="message" style="min-height: 24px; color: var(--subtext);"></p>

    <div class="controls">
      <button data-action="PARRY" disabled>Parry (F)</button>
      <button data-action="DODGE" disabled>Dodge (Q)</button>
      <button data-action="JUMP" disabled>Jump (Space)</button>
      <button data-action="CROUCH" disabled>Crouch (Ctrl)</button>
    </div>

    <div style="display: flex; gap: 20px; font-size: 14px; color: var(--subtext);">
      <div>Rounds: <span id="round" style="color: #fff;">0/20</span></div>
      <div>Accuracy: <span id="accuracy" style="color: #fff;">—</span></div>
      <div>Avg Time: <span id="average" style="color: #fff;">—</span></div>
      <div>PvE Score: <span id="pve-score" style="color: var(--accent);">0</span></div>
    </div>
  </div>

  <!-- Global Leaderboard Card -->
  <div class="card">
    <h2>🏆 Global Leaderboard (Top Players)</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>PvE Score</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="3" style="text-align:center">Loading leaderboard...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const $=id=>document.getElementById(id);
const names={PARRY:"PARRY",DODGE:"ROLL / DODGE",JUMP:"JUMP",CROUCH:"CROUCH"};
const colors={PARRY:"gray",DODGE:"red",JUMP:"purple",CROUCH:"blue"};
const symbols={PARRY:"F",DODGE:"Q",JUMP:"↑",CROUCH:"↓"};

// Твои ключи Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDMSC3W6Wjju5G0c2kofKlWij0PiUrLZ_0",
  authDomain: "traningmaster-e1ee1.firebaseapp.com",
  databaseURL: "https://traningmaster-e1ee1-default-rtdb.firebaseio.com",
  projectId: "traningmaster-e1ee1",
  storageBucket: "traningmaster-e1ee1.firebasestorage.app",
  messagingSenderId: "793487316364",
  appId: "1:793487316364:web:1f5933cfe0e15ce04e72a9"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// Получаем или создаём уникальный ID устройства для игрока
let userId = localStorage.getItem("deepwoken_user_id");
if (!userId) {
  userId = "usr_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("deepwoken_user_id", userId);
}

// Загрузка сохранённого ника
if (localStorage.getItem("deepwoken_username")) {
  $("username").value = localStorage.getItem("deepwoken_username");
}

const weapons = {
  heavy: { name: "Heavy", dmg: 1200, maxCombo: 1, cooldown: 400 },
  medium: { name: "Medium", dmg: 600, maxCombo: 2, cooldown: 200 },
  light: { name: "Light", dmg: 300, maxCombo: 3, cooldown: 120 }
};

const bossStats = {
  random: { name: "Target Dummy", hp: 10000, damage: 50, diff: "normal", moves: ["PARRY","DODGE","JUMP","CROUCH"] },
  primadon: { name: "Primadon", hp: 40000, damage: 80, diff: "normal", moves: ["PARRY","DODGE"] },
  elder_primadon: { name: "Elder Primadon", hp: 90000, damage: 110, diff: "hard", moves: ["PARRY","DODGE","JUMP"] },
  maestro: { name: "Maestro Evengarde", hp: 15000, damage: 70, diff: "hard", moves: ["PARRY","DODGE","CROUCH"] },
  duke: { name: "Duke Erisia", hp: 15000, damage: 65, diff: "normal", moves: ["PARRY","DODGE","CROUCH"] },
  ferryman: { name: "Ferryman", hp: 15000, damage: 75, diff: "expert", moves: ["PARRY","DODGE","JUMP"] }
};

let active=false, waiting=false, canAttack=false, attackTimer=null, target="", shownAt=0, timer=null, gapTimer=null, index=0, total=20, hits=0, times=[], results=[];
let playerMaxHp=600, playerHp=600, bossMaxHp=40000, bossHp=40000;
let isPhaseTwo=false, lastAttackTime=0, currentComboHits=0;
let totalPveScore = Number(localStorage.getItem("pve_score") || 0);

function enable(on){document.querySelectorAll("[data-action]").forEach(b=>b.disabled=!on)}

function cue(title,sub,action=null){
 const box=$("cue");
 if(action){box.innerHTML=`<div><div class="signal-orb ${colors[action]}">${symbols[action]}</div><div><strong>${title}</strong></div><span>${sub}</span></div>`}
 else {box.innerHTML=`<div><strong>${title}</strong><br><span>${sub}</span></div>`}
}

function getDifficultySettings() {
  const bossKey = $("boss").value;
  const diff = bossKey === "random" ? $("difficulty").value : bossStats[bossKey].diff;
  
  let base = { minDelay: 400, addDelay: 650, timeout: 680 };
  if(diff === "easy") base = { minDelay: 1000, addDelay: 1200, timeout: 1400 };
  else if(diff === "normal") base = { minDelay: 700, addDelay: 950, timeout: 1050 };
  else if(diff === "hard") base = { minDelay: 450, addDelay: 700, timeout: 780 };
  else if(diff === "expert") base = { minDelay: 300, addDelay: 500, timeout: 550 };
  else if(diff === "extreme") base = { minDelay: 180, addDelay: 350, timeout: 400 };
  else if(diff === "impossible") base = { minDelay: 120, addDelay: 220, timeout: 300 };

  if(isPhaseTwo) {
    base.minDelay = Math.round(base.minDelay * 0.8);
    base.addDelay = Math.round(base.addDelay * 0.8);
    base.timeout = Math.round(base.timeout * 0.85);
  }
  return base;
}

function updateHpUI() {
  $("player-hp-text").textContent = `${Math.max(0, playerHp)}/${playerMaxHp}`;
  $("player-hp-fill").style.width = `${Math.max(0, (playerHp / playerMaxHp) * 100)}%`;
  
  $("boss-hp-text").textContent = `${Math.max(0, bossHp)}/${bossMaxHp}`;
  $("boss-hp-fill").style.width = `${Math.max(0, (bossHp / bossMaxHp) * 100)}%`;

  if(!isPhaseTwo && bossHp <= bossMaxHp / 2 && bossHp > 0) {
    isPhaseTwo = true;
    $("phase-badge").style.display = "inline-block";
    $("message").textContent = "PHASE 2 STARTED! Boss hostility increased!";
  }
}

function waitNext(){
 if(!active)return;
 if(index>=total || playerHp <= 0 || bossHp <= 0){finish();return}
 waiting=false;canAttack=false;target="";currentComboHits=0;
 cue("DEFEND!", isPhaseTwo ? "⚡ PHASE 2 ATTACK INCOMING!" : "Watch for the attack signal!");
 const cfg = getDifficultySettings();
 const delay = cfg.minDelay + Math.random() * cfg.addDelay;
 gapTimer=setTimeout(()=>{
  if(!active)return;
  const bossKey = $("boss").value;
  const allowedMoves = bossStats[bossKey].moves;
  target=allowedMoves[Math.floor(Math.random()*allowedMoves.length)];
  waiting=true;shownAt=performance.now();cue(names[target],"REACT!",target);
  timer=setTimeout(()=>{
    if(waiting){
      waiting=false;
      results.push(false);
      const boss = bossStats[bossKey];
      playerHp -= boss.damage;
      updateHpUI();
      $("message").textContent=`Too slow! ${boss.name} hit you for ${boss.damage} DMG.`;
      update();
      index++;
      waitNext();
    }
  }, cfg.timeout);
 },delay);
}

function respond(action){
 if(!active || !waiting) return;
 
 clearTimeout(timer);waiting=false;
 const ms=Math.round(performance.now()-shownAt),ok=action===target;
 results.push(ok);
 const bossKey = $("boss").value;
 const boss = bossStats[bossKey];

 if(ok){
   hits++;
   times.push(ms);
   canAttack = true;
   currentComboHits = 0;
   const w = weapons[$("weapon").value];
   cue("OPENING WINDOW!", `CLICK TO COMBO! (Max ${w.maxCombo} Hit${w.maxCombo > 1 ? 's':''})`);
   $("message").textContent=`Defended successfully (${ms} ms)! CLICK LMB to strike back!`;
   clearTimeout(attackTimer);
   attackTimer = setTimeout(() => {
     if(canAttack && active) {
       canAttack = false;
       $("message").textContent = "Attack window closed!";
       index++; update(); waitNext();
     }
   }, 1300);
 } else {
   playerHp -= boss.damage;
   $("message").textContent=`Failed defence! Needed ${names[target]}. Took ${boss.damage} DMG.`;
   updateHpUI();
   index++; update(); waitNext();
 }
}

function playerAttack() {
  if(!active || !canAttack) return;
  const now = performance.now();
  const w = weapons[$("weapon").value];
  
  if(now - lastAttackTime < w.cooldown) return;
  
  lastAttackTime = now;
  currentComboHits++;
  bossHp -= w.dmg;
  updateHpUI();

  if(currentComboHits >= w.maxCombo) {
    canAttack = false;
    clearTimeout(attackTimer);
    $("message").textContent = `FULL COMBO! Dealt ${w.dmg * w.maxCombo} total DMG with ${w.name} weapon!`;
    index++; update();
    setTimeout(waitNext, 450);
  } else {
    $("message").textContent = `Hit ${currentComboHits}/${w.maxCombo}! Dealt ${w.dmg} DMG! Click again!`;
  }
}

// 🌐 ГЛОБАЛЬНОЕ СОХРАНЕНИЕ ПО УНИКАЛЬНОМУ ID УСТРОЙСТВА
function saveToGlobalLeaderboard(username, newScore) {
  if(!username || username.trim() === "") username = "Anonymous Player";
  localStorage.setItem("deepwoken_username", username);

  const userRef = database.ref('leaderboard/' + userId);
  userRef.set({ name: username, score: newScore });
}

// 🌐 ЧТЕНИЕ ТОПА ИЗ FIREBASE
function listenGlobalLeaderboard() {
  database.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
    const players = [];
    snapshot.forEach((child) => {
      players.push(child.val());
    });
    players.sort((a, b) => b.score - a.score);

    const tbody = $("leaderboard-body");
    if(tbody) {
      if(players.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center">No records yet. Be the first!</td></tr>`;
      } else {
        tbody.innerHTML = players.map((p, i) => `
          <tr>
            <td><b>#${i + 1}</b></td>
            <td>${p.name}</td>
            <td><strong style="color:var(--accent)">${p.score} pts</strong></td>
          </tr>
        `).join("");
      }
    }
  });
}

function update(){
 $("round").textContent=`${Math.min(index,total)}/${total}`;
 $("accuracy").textContent=results.length?Math.round(hits/results.length*100)+"%":"—";
 $("average").textContent=times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length)+" ms":"—";
 $("pve-score").textContent = totalPveScore;
}

function finish(){
 active=false;waiting=false;canAttack=false;enable(false);
 $("start").disabled=false;$("start").textContent="Start Combat";
 $("end-btn").disabled=true;
 
 const acc = results.length ? Math.round(hits/results.length*100) : 0;
 let scoreGained = 0;
 
 if(playerHp > 0) {
   if(acc === 100) scoreGained = 3;
   else if(acc >= 90) scoreGained = 2;
   else if(acc >= 40) scoreGained = 1;
 }

 if(scoreGained > 0) {
   totalPveScore += scoreGained;
   localStorage.setItem("pve_score", totalPveScore);
   const username = $("username").value.trim();
   saveToGlobalLeaderboard(username, totalPveScore);
 }

 let endMsg = playerHp <= 0 ? "YOU DIED! The boss defeated you." : bossHp <= 0 ? "VICTORY! Boss Slain!" : "TRAINING FINISHED!";
 cue(endMsg, `Accuracy: ${acc}% · Gained +${scoreGained} PvE Score!`);
 $("message").textContent=times.length?`Average Reaction: ${Math.round(times.reduce((a,b)=>a+b,0)/times.length)} ms.`:"Game Over.";
 update();
}

function stopPractice(){
 if(!active) return;
 clearTimeout(timer);clearTimeout(gapTimer);clearTimeout(attackTimer);
 active=false;waiting=false;canAttack=false;enable(false);
 $("start").disabled=false;$("start").textContent="Start Combat";
 $("end-btn").disabled=true;
 cue("COMBAT ENDED", "Combat session was manually terminated.");
 $("message").textContent = "Practice ended by user.";
}

function startPractice(){
 clearTimeout(timer);clearTimeout(gapTimer);clearTimeout(attackTimer);
 const bossKey = $("boss").value;
 const b = bossStats[bossKey];
 bossMaxHp = bossHp = b.hp;
 playerMaxHp = playerHp = 600;
 isPhaseTwo = false;
 $("phase-badge").style.display = "none";
 $("boss-name-label").textContent = `${b.name} HP`;
 updateHpUI();

 active=true;waiting=false;canAttack=false;index=hits=0;times=[];results=[];total=Number($("rounds").value);
 $("start").disabled=true;$("start").textContent="In Combat…";
 $("end-btn").disabled=false;
 enable(true);
 update();
 waitNext();
}

document.addEventListener("click", (e) => {
  if(e.button === 0 && !e.target.closest("select") && !e.target.closest("button") && !e.target.closest("input")) {
    playerAttack();
  }
});

document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>respond(b.dataset.action)));

document.addEventListener("keydown",e=>{
 if(!active) return;
 if(e.repeat) return;
 
 if(e.code === "KeyF"){e.preventDefault();respond("PARRY");return}
 if(e.code === "KeyQ"){e.preventDefault();respond("DODGE");return}
 if(e.code === "Space"){e.preventDefault();respond("JUMP");return}
 if(e.code === "ControlLeft" || e.code === "ControlRight" || e.key === "Control"){
   e.preventDefault();
   respond("CROUCH");
   return;
 }
});

listenGlobalLeaderboard();
$("pve-score").textContent = totalPveScore;
</script>
</body>
</html>
